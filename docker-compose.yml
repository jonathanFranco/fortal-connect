services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # mantém node_modules e .next da imagem, sem misturar com os do host
      - /app/node_modules
      - /app/.next
    environment:
      # detecta mudanças em bind mounts no macOS/Windows
      WATCHPACK_POLLING: "true"
